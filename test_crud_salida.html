<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test CRUD Salida Repuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test CRUD Salida de Repuesto</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Eliminación</h5>
                    </div>
                    <div class="card-body">
                        <form method="GET" action="controllers/SaliRepueController.php">
                            <input type="hidden" name="action" value="eliminar">
                            <div class="mb-3">
                                <label class="form-label">ID de Salida a Eliminar:</label>
                                <input type="number" name="id" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-danger" onclick="return confirm('¿Eliminar salida?')">
                                Eliminar Salida
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Listar Salidas</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info" onclick="listarSalidas()">
                            Cargar Salidas
                        </button>
                        <div id="salidasList" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Logs de Debugging</h5>
                    </div>
                    <div class="card-body">
                        <div id="logs" class="bg-light p-3" style="height: 300px; overflow-y: auto; font-family: monospace;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(message) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toISOString();
            logsDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        async function listarSalidas() {
            log('Iniciando carga de salidas...');
            try {
                const response = await fetch('controllers/SaliRepueController.php?action=listar');
                log(`Response status: ${response.status}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                log(`Datos recibidos: ${JSON.stringify(data, null, 2)}`);
                
                const salidasDiv = document.getElementById('salidasList');
                if (Array.isArray(data) && data.length > 0) {
                    let html = '<table class="table table-sm"><thead><tr><th>ID</th><th>Fecha</th><th>Cantidad</th><th>Repuesto</th></tr></thead><tbody>';
                    data.forEach(salida => {
                        html += `<tr>
                            <td>${salida.id}</td>
                            <td>${salida.fecha_salida}</td>
                            <td>${salida.cantidad}</td>
                            <td>${salida.repuesto_nombre || 'N/A'}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                    salidasDiv.innerHTML = html;
                } else {
                    salidasDiv.innerHTML = '<div class="alert alert-info">No hay salidas de repuesto</div>';
                }
                
            } catch (error) {
                log(`Error: ${error.message}`);
                document.getElementById('salidasList').innerHTML = '<div class="alert alert-danger">Error al cargar salidas</div>';
            }
        }
        
        // Cargar salidas al inicio
        document.addEventListener('DOMContentLoaded', function() {
            log('Página cargada');
            listarSalidas();
        });
    </script>
</body>
</html>
