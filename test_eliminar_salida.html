<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Eliminar Salida Repuesto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f1c2c7; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Test Eliminación Salida de Repuesto</h1>
    
    <div>
        <label>ID de la salida a eliminar:</label>
        <input type="number" id="salidaId" placeholder="Ej: 1">
        <button onclick="debugSalida()">Debug Salida</button>
        <button onclick="eliminarSalida()">Eliminar Salida</button>
    </div>
    
    <div id="results"></div>

    <script>
        async function debugSalida() {
            const id = document.getElementById('salidaId').value;
            if (!id) {
                alert('Por favor ingrese un ID');
                return;
            }
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Debuggeando salida...</div>';
            
            try {
                const response = await fetch(`/trucksisx/debug_salida_repue.php?id=${id}`);
                const data = await response.json();
                
                let html = `<h2>Debug de Salida ID: ${id}</h2>`;
                
                if (data.success) {
                    html += '<div class="success">Información obtenida correctamente</div>';
                    html += '<h3>Datos de la Salida:</h3>';
                    html += '<pre>' + JSON.stringify(data.salida, null, 2) + '</pre>';
                    html += '<h3>Constraints:</h3>';
                    html += '<pre>' + JSON.stringify(data.constraints, null, 2) + '</pre>';
                } else {
                    html += `<div class="error">Error: ${data.message}</div>`;
                }
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error de conexión: ${error.message}</div>`;
            }
        }
        
        async function eliminarSalida() {
            const id = document.getElementById('salidaId').value;
            if (!id) {
                alert('Por favor ingrese un ID');
                return;
            }
            
            if (!confirm(`¿Eliminar salida ID ${id}?`)) {
                return;
            }
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Eliminando salida...</div>';
            
            try {
                // Hacer petición directa al controlador
                const response = await fetch(`/trucksisx/controllers/SaliRepueController.php?action=eliminar&id=${id}`, {
                    method: 'GET',
                    redirect: 'manual' // No seguir redirecciones automáticamente
                });
                
                console.log('Response status:', response.status);
                console.log('Response type:', response.type);
                console.log('Response redirected:', response.redirected);
                console.log('Response url:', response.url);
                
                let html = `<h2>Resultado de Eliminación ID: ${id}</h2>`;
                
                if (response.status === 0 || response.type === 'opaqueredirect') {
                    html += '<div class="success">Redirección detectada - probablemente exitoso</div>';
                    html += '<div class="info">Verificar en la página principal si la salida fue eliminada</div>';
                } else if (response.ok) {
                    const text = await response.text();
                    if (text.trim()) {
                        html += `<div class="error">Respuesta inesperada: ${text}</div>`;
                    } else {
                        html += '<div class="success">Eliminación aparentemente exitosa</div>';
                    }
                } else {
                    html += `<div class="error">Error HTTP: ${response.status}</div>`;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error completo:', error);
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
