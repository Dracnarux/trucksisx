<!-- Diagrama SVG Estático - Camión Doble Troque -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
    <defs>
        <style>
            .truck-body { fill: #4a90e2; stroke: #2d5aa0; stroke-width: 2; }
            .truck-cabin { fill: #5ba0f2; stroke: #2d5aa0; stroke-width: 2; }
            .tire { fill: #333; stroke: #000; stroke-width: 2; cursor: pointer; }
            .tire:hover { stroke: #007bff; stroke-width: 3; }
            .tire-connection { stroke: #666; stroke-width: 2; fill: none; }
            .tire-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; text-anchor: middle; }
            .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
            .legend-text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
        </style>
    </defs>
    
    <!-- Título -->
    <text x="450" y="25" class="title">Sistema de Alertas de Llantas - Camión Doble Troque</text>
    
    <!-- Cabina -->
    <rect x="50" y="100" width="120" height="80" class="truck-cabin" rx="5"/>
    <text x="110" y="145" class="legend-text" text-anchor="middle">CABINA</text>
    
    <!-- Carrocería principal -->
    <rect x="170" y="90" width="600" height="100" class="truck-body" rx="5"/>
    <text x="470" y="145" class="legend-text" text-anchor="middle">CARROCERÍA PRINCIPAL</text>
    
    <!-- Conexiones entre ejes (líneas estructurales) -->
    <line x1="200" y1="190" x2="300" y2="190" class="tire-connection"/>
    <line x1="350" y1="190" x2="500" y2="190" class="tire-connection"/>
    <line x1="550" y1="190" x2="700" y2="190" class="tire-connection"/>
    
    <!-- Llantas direccionales (frontales) -->
    <circle cx="120" cy="200" r="25" class="tire" data-position="direccion_izquierda"/>
    <circle cx="120" cy="240" r="25" class="tire" data-position="direccion_derecha"/>
    
    <!-- Conexión entre llantas direccionales -->
    <line x1="120" y1="175" x2="120" y2="215" class="tire-connection"/>
    
    <!-- Llantas tracción primera (eje 1) -->
    <circle cx="280" cy="200" r="25" class="tire" data-position="traccion1_izquierda"/>
    <circle cx="280" cy="240" r="25" class="tire" data-position="traccion1_derecha"/>
    <circle cx="320" cy="200" r="25" class="tire" data-position="traccion1_izquierda2"/>
    <circle cx="320" cy="240" r="25" class="tire" data-position="traccion1_derecha2"/>
    
    <!-- Conexiones tracción primera -->
    <line x1="280" y1="175" x2="280" y2="215" class="tire-connection"/>
    <line x1="320" y1="175" x2="320" y2="215" class="tire-connection"/>
    <line x1="255" y1="200" x2="255" y2="240" class="tire-connection"/>
    <line x1="345" y1="200" x2="345" y2="240" class="tire-connection"/>
    
    <!-- Llantas tracción segunda (eje 2) -->
    <circle cx="650" cy="200" r="25" class="tire" data-position="traccion2_izquierda"/>
    <circle cx="650" cy="240" r="25" class="tire" data-position="traccion2_derecha"/>
    
    <!-- Conexión entre llantas tracción segunda -->
    <line x1="650" y1="175" x2="650" y2="215" class="tire-connection"/>
    
    <!-- Etiquetas de llantas -->
    <text x="120" y="175" class="tire-label">DIR-I</text>
    <text x="120" y="265" class="tire-label">DIR-D</text>
    <text x="280" y="175" class="tire-label">T1-I</text>
    <text x="280" y="265" class="tire-label">T1-D</text>
    <text x="320" y="175" class="tire-label">T1-I2</text>
    <text x="320" y="265" class="tire-label">T1-D2</text>
    <text x="650" y="175" class="tire-label">T2-I</text>
    <text x="650" y="265" class="tire-label">T2-D</text>
    
    <!-- Leyenda de estados -->
    <g transform="translate(50, 320)">
        <text x="0" y="0" class="legend-text" font-weight="bold">Leyenda de Estados:</text>
        
        <circle cx="20" cy="20" r="8" fill="#333" stroke="#000"/>
        <text x="35" y="25" class="legend-text">Normal</text>
        
        <circle cx="120" cy="20" r="8" fill="#ffff00" stroke="#000"/>
        <text x="135" y="25" class="legend-text">Alerta Baja</text>
        
        <circle cx="240" cy="20" r="8" fill="#ffa500" stroke="#000"/>
        <text x="255" y="25" class="legend-text">Alerta Media</text>
        
        <circle cx="360" cy="20" r="8" fill="#ff4444" stroke="#000"/>
        <text x="375" y="25" class="legend-text">Alerta Alta/Crítica</text>
        
        <circle cx="510" cy="20" r="8" fill="#28a745" stroke="#000"/>
        <text x="525" y="25" class="legend-text">Resuelta</text>
    </g>
    
    <!-- Instrucciones -->
    <g transform="translate(50, 360)">
        <text x="0" y="0" class="legend-text" font-style="italic">
            Haga clic en cualquier llanta para registrar una nueva alerta
        </text>
    </g>
    
    <!-- Indicadores de sistema -->
    <g transform="translate(780, 60)">
        <rect x="0" y="0" width="100" height="50" fill="#f8f9fa" stroke="#ddd" rx="5"/>
        <text x="50" y="15" class="legend-text" text-anchor="middle" font-size="10">SISTEMA</text>
        <text x="50" y="25" class="legend-text" text-anchor="middle" font-size="10">ALERTAS</text>
        <text x="50" y="35" class="legend-text" text-anchor="middle" font-size="10">ACTIVO</text>
        <circle cx="85" cy="40" r="3" fill="#28a745"/>
    </g>
</svg>