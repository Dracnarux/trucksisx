<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test FK Constraint Fix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test Corrección FK Constraints</h1>
        
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Analizar FK Constraints</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info" onclick="analizarConstraints()">
                            Analizar Constraints y Datos
                        </button>
                        <div id="constraintsInfo" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Eliminación con Reporte</h5>
                    </div>
                    <div class="card-body">
                        <div id="salidasConReporte"></div>
                        <div class="mt-3">
                            <button class="btn btn-warning" onclick="testEliminarConReporte()">
                                Test Eliminar Salida con Reporte
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Logs en Tiempo Real</h5>
                    </div>
                    <div class="card-body">
                        <div id="logs" class="bg-light p-3" style="height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(message) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toISOString();
            logsDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        let salidasConReporte = [];
        
        async function analizarConstraints() {
            log('Analizando FK constraints y datos...');
            try {
                const response = await fetch('debug_fk_constraints.php');
                const data = await response.json();
                
                log(`Respuesta recibida: ${JSON.stringify(data, null, 2)}`);
                
                if (data.success) {
                    salidasConReporte = data.salidas_con_reporte;
                    
                    let html = '<h6>FK Constraints encontradas:</h6><ul>';
                    data.fk_constraints.forEach(fk => {
                        html += `<li><strong>${fk.CONSTRAINT_NAME}</strong>: ${fk.COLUMN_NAME} → ${fk.REFERENCED_TABLE_NAME}.${fk.REFERENCED_COLUMN_NAME}</li>`;
                    });
                    html += '</ul>';
                    
                    html += `<h6>Salidas con reporte (${data.salidas_con_reporte.length}):</h6>`;
                    if (data.salidas_con_reporte.length > 0) {
                        html += '<table class="table table-sm"><thead><tr><th>ID</th><th>Fecha</th><th>Cantidad</th><th>Reporte ID</th></tr></thead><tbody>';
                        data.salidas_con_reporte.forEach(salida => {
                            html += `<tr>
                                <td>${salida.id}</td>
                                <td>${salida.fecha_salida}</td>
                                <td>${salida.cantidad}</td>
                                <td>${salida.repor_id}</td>
                            </tr>`;
                        });
                        html += '</tbody></table>';
                    } else {
                        html += '<div class="alert alert-info">No hay salidas con reportes asociados</div>';
                    }
                    
                    html += `<p><strong>Total de salidas:</strong> ${data.total_salidas}</p>`;
                    
                    document.getElementById('constraintsInfo').innerHTML = html;
                    
                    // Mostrar las salidas con reporte para testing
                    let salidasHtml = '<h6>Seleccionar salida para eliminar:</h6>';
                    if (salidasConReporte.length > 0) {
                        salidasHtml += '<select id="salidaSelect" class="form-select">';
                        salidasConReporte.forEach(salida => {
                            salidasHtml += `<option value="${salida.id}">ID ${salida.id} - Reporte ${salida.repor_id} - ${salida.fecha_salida}</option>`;
                        });
                        salidasHtml += '</select>';
                    } else {
                        salidasHtml += '<div class="alert alert-warning">No hay salidas con reportes para probar</div>';
                    }
                    
                    document.getElementById('salidasConReporte').innerHTML = salidasHtml;
                    
                } else {
                    log(`Error: ${data.message}`);
                }
                
            } catch (error) {
                log(`Error de conexión: ${error.message}`);
            }
        }
        
        async function testEliminarConReporte() {
            const select = document.getElementById('salidaSelect');
            if (!select || !select.value) {
                alert('Primero analiza los constraints y selecciona una salida');
                return;
            }
            
            const id = select.value;
            const confirmMessage = `¿Estás seguro de eliminar la salida ID ${id}?\nEsto probará la corrección de FK constraints.`;
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            log(`Iniciando test de eliminación para ID ${id}...`);
            
            try {
                // Usar el controlador real
                const response = await fetch(`controllers/SaliRepueController.php?action=eliminar&id=${id}`, {
                    method: 'GET',
                    redirect: 'manual'
                });
                
                log(`Response status: ${response.status}`);
                log(`Response type: ${response.type}`);
                log(`Response redirected: ${response.redirected}`);
                
                if (response.status === 0 || response.type === 'opaqueredirect') {
                    log('Redirección detectada - probablemente exitoso');
                    
                    // Reanalizar para ver si se eliminó
                    setTimeout(() => {
                        log('Re-analizando datos después de eliminación...');
                        analizarConstraints();
                    }, 1000);
                    
                } else {
                    const text = await response.text();
                    log(`Response body: ${text}`);
                }
                
            } catch (error) {
                log(`Error durante eliminación: ${error.message}`);
            }
        }
        
        // Auto-inicializar
        document.addEventListener('DOMContentLoaded', function() {
            log('Página cargada - iniciando análisis...');
            analizarConstraints();
        });
    </script>
</body>
</html>
