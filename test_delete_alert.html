<!DOCTYPE html>
<html>
<head>
    <title>Prueba de Eliminación de Alertas</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h2>Prueba de Eliminación de Alertas</h2>
    <button onclick="testDelete()">Probar Eliminación (ID de prueba: 999)</button>
    <div id="result"></div>

    <script>
        async function testDelete() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Probando eliminación...';
            
            try {
                const formData = new FormData();
                formData.append('id', '999'); // ID de prueba que no existe
                
                console.log('Enviando petición DELETE...');
                
                const response = await fetch('/trucksisx/controllers/AlertController.php?action=delete', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Respuesta recibida:', response.status, response.ok);
                
                const responseText = await response.text();
                console.log('Texto de respuesta:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    resultDiv.innerHTML = `
                        <h4>Respuesta del servidor:</h4>
                        <p><strong>Success:</strong> ${data.success}</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } catch (parseError) {
                    resultDiv.innerHTML = `
                        <h4>Error parsing JSON:</h4>
                        <p>${parseError.message}</p>
                        <h4>Respuesta cruda:</h4>
                        <pre>${responseText}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
