<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test FK Alert Dependencies</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f1c2c7; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Test de Dependencias FK para Alertas</h1>
    
    <button onclick="checkDependencies()">Verificar Dependencias</button>
    <button onclick="testDeleteAlert()">Probar Eliminación</button>
    
    <div id="results"></div>

    <script>
        async function checkDependencies() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Verificando dependencias...</div>';
            
            try {
                const response = await fetch('/trucksisx/test_alert_dependencies.php');
                const data = await response.json();
                
                let html = '<h2>Resultados de Verificación de Dependencias</h2>';
                
                if (data.success) {
                    html += '<div class="success">Verificación completada</div>';
                    
                    // Mostrar alertas existentes
                    html += '<h3>Alertas en el Sistema:</h3>';
                    if (data.alerts && data.alerts.length > 0) {
                        html += '<table><tr><th>ID</th><th>Descripción</th><th>Estado</th><th>Prioridad</th></tr>';
                        data.alerts.forEach(alert => {
                            html += `<tr><td>${alert.id}</td><td>${alert.descripcion}</td><td>${alert.estado}</td><td>${alert.prioridad}</td></tr>`;
                        });
                        html += '</table>';
                    } else {
                        html += '<div class="info">No hay alertas en el sistema</div>';
                    }
                    
                    // Mostrar dependencias
                    html += '<h3>Dependencias por Alerta:</h3>';
                    Object.keys(data.dependencies).forEach(alertId => {
                        const deps = data.dependencies[alertId];
                        html += `<h4>Alerta ID: ${alertId}</h4>`;
                        html += `<ul>`;
                        html += `<li>Órdenes de trabajo: ${deps.ord_trabj}</li>`;
                        html += `<li>Salidas de repuestos: ${deps.sali_repue}</li>`;
                        html += `<li>Salidas de vehículos: ${deps.sali_vehi}</li>`;
                        html += `</ul>`;
                    });
                } else {
                    html += `<div class="error">Error: ${data.message}</div>`;
                }
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error de conexión: ${error.message}</div>`;
            }
        }
        
        async function testDeleteAlert() {
            const alertId = prompt('Ingrese el ID de la alerta a eliminar:');
            if (!alertId) return;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Probando eliminación...</div>';
            
            try {
                const formData = new FormData();
                formData.append('id', alertId);
                
                const response = await fetch('/trucksisx/controllers/AlertController.php?action=delete', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `<div class="success">¡Éxito! ${data.message}</div>`;
                } else {
                    resultsDiv.innerHTML = `<div class="error">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
